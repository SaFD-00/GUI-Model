# Monkey-Collector — 수집 파라미터.
#
# Resolution order (later wins):
#   builtin defaults (src/monkey_collector/config.py) → config/run.yaml → MC_* env vars → CLI flags
#
# CLI flags take highest precedence. 이 파일이 없어도 builtin defaults 로 동작한다
# (`monkey-collect --help` 가 환경에 의존하지 않도록).
#
# builtin defaults 는 이 파일의 값과 **정확히 같아야** 한다 (config.py 의 _BUILTIN_DEFAULTS).

device:
  # 대상 디바이스 serial. **null 이 아니다** — 이 값이 고정이다.
  # 이 머신에는 디바이스가 둘 붙어 있다: 실기기 Pixel 6 (수집 타깃, 이 serial) 과
  # emulator-5556 (다른 작업 중이라 절대 건드리면 안 됨). serial 이 null 이면
  # 자동탐지가 둘 중 하나를 고르거나 모호하다고 죽는데, 잘못 골라 에뮬레이터를 몰기
  # 시작하는 것이 최악이라 기본값을 실기기로 못박는다.
  # Env: MC_DEVICE_SERIAL
  serial: "19101FDF6004EH"
  # 디바이스 논리 해상도 (`adb shell wm size`). export 좌표 변환의 소스 프레임이다.
  # Env: MC_DEVICE_WIDTH / MC_DEVICE_HEIGHT
  width: 1080
  height: 2400

collection:
  # 세션 종료 조건. Options: time | steps
  #   time:  max_duration 만큼의 벽시계 시간이 지나면 종료 (기본)
  #   steps: max_steps 만큼 action 을 수행하면 종료
  # Env: MC_COLLECTION_BUDGET_MODE
  budget_mode: time
  # 앱당 벽시계 예산 (budget_mode=time 일 때 종료 조건).
  # "2h" / "120m" / "7200s" / 숫자(초) 를 받는다. 파싱 실패나 0 이하는 에러다
  # (조용히 2h 로 폴백하면 오타난 설정이 성공한 것처럼 보인다).
  # Env: MC_COLLECTION_MAX_DURATION
  max_duration: "2h"
  # 앱당 최대 step 수 (budget_mode=steps 일 때만 사용). Env: MC_COLLECTION_MAX_STEPS
  max_steps: 1500
  # explorer 난수 시드. Env: MC_COLLECTION_SEED
  seed: 42
  # action 실행 후 다음 관측까지의 기본 지연(ms). Env: MC_COLLECTION_ACTION_DELAY_MS
  action_delay_ms: 1500
  # --- host-pull 전용: 화면 안정화(stabilization) ---
  # device-push 설계와 달리 디바이스가 "화면이 바뀌었다" 는 신호를 보내주지 않으므로
  # 호스트가 스스로 판정해야 한다. **스크린샷 픽셀 비교**로 폴링하고, 화면이 멎은 뒤
  # `uiautomator dump` 를 딱 한 번 뜬다. Pixel 6 실측 근거 (6회 중앙값):
  #   uiautomator dump 2.34s / screencap -p 0.68s  -> 스크린샷 폴링이 3.44배 싸다.
  # 자세한 설계는 src/monkey_collector/stabilize.py 의 모듈 docstring 을 본다.
  #
  # 폴링 사이 추가 sleep(ms). 기본 0 — screencap 자체가 ~0.68s 라 프레임 간격은
  # 이미 충분히 벌어져 있고, sleep 을 더하면 지연만 늘어난다.
  # Env: MC_COLLECTION_STABILIZE_POLL_MS
  stabilize_poll_ms: 0
  # 안정화 최대 대기(초). 초과하면 마지막 프레임을 채택하고 진행한다.
  # 영상·스피너·깜빡이는 커서처럼 **영원히 안 멎는 화면**이 실제로 있으므로 필수다.
  # Env: MC_COLLECTION_STABILIZE_MAX_WAIT_SEC
  stabilize_max_wait_sec: 8.0
  # 변경 픽셀 비율이 이 값 이하면 "멎었다" 로 본다. **0 으로 낮추지 마라** — 실제
  # 화면 전환은 0.0000 까지 수렴해서 "0 이면 되겠네" 로 가기 쉽지만, 영상·스피너·
  # 깜빡이는 커서는 영원히 같아지지 않는다. 0 이면 그런 화면에서 매 step 대기
  # 예산을 통째로 태우면서도 데이터는 계속 나와 **조용히** 느려진다.
  # Env: MC_COLLECTION_STABILIZE_PIXEL_THRESHOLD
  stabilize_pixel_threshold: 0.005
  # 픽셀 하나가 "바뀌었다" 고 볼 밝기 차(0-255). 리샘플링 흔들림·서브픽셀 AA 를 흡수한다.
  # Env: MC_COLLECTION_STABILIZE_LUMA_DELTA
  stabilize_luma_delta: 10
  # 비교용 썸네일 가로 폭(px). 100 이면 1080x2400 이 100x222 로 줄어 비교가 빠르다.
  # Env: MC_COLLECTION_STABILIZE_LOW_RES_WIDTH
  stabilize_low_res_width: 100
  # 앱을 실행/재실행한 뒤 첫 관측 전까지의 고정 대기(초). 안정화 폴링이 어차피 돌지만,
  # cold start 직후에는 런처 애니메이션이 잠깐 멎어 앱처럼 보일 수 있어 그 창을 넘긴다.
  # 0 이면 곧바로 폴링으로 넘어간다(테스트는 0 을 쓴다). Env: MC_COLLECTION_LAUNCH_SETTLE_SEC
  launch_settle_sec: 2.0

page_matching:
  # page 식별은 **LLM-Explorer 방법**이고 항상 LLM-free 다.
  # 픽셀은 page 식별에 쓰지 않는다 — 스크린샷 비교는 화면 **안정화** 전용이다
  # (collection.stabilize_* / src/monkey_collector/stabilize.py).
  #
  # merge_policy: 두 해시가 모두 빗나갔을 때의 처리.
  #   structure_only    새 page 발급.
  #   similar_elements  (기본) 같은 activity 안에서 content-free signature 대칭차가
  #                     max_diff_elements 이하인 가장 가까운 page 로 병합.
  # Env: MC_PAGE_MATCHING_MERGE_POLICY
  merge_policy: similar_elements
  # 대칭차 예산. Pixel 6 실측 여유: 같은 page 스크롤 = 2, 가장 가까운 **다른** 화면 = 18.
  # 넓히지 마라 — 과병합은 시도하지도 않은 action 을 explored 로 표시하고, 그 손상은
  # 수집된 데이터만 봐서는 복구도 발견도 안 된다.
  # Env: MC_PAGE_MATCHING_MAX_DIFF_ELEMENTS
  max_diff_elements: 2
  # activity 가 다르면 병합하지 않는다.
  # Env: MC_PAGE_MATCHING_SAME_ACTIVITY_ONLY
  same_activity_only: true

exploration:
  # LLM-Explorer 탐색 정책 (ARCHITECTURE §5). "다음에 무엇을 누를지" 는 100% 규칙 기반이고
  # LLM 이 탐색에 개입하는 지점은 same-function 그룹핑 하나뿐이다 (skip_similar_elements).
  #
  # 같은 구조 프레임(structure_str)을 연속으로 이만큼 본 뒤에도 화면이 안 바뀌면 BACK 으로 탈출.
  # Env: MC_EXPLORATION_MAX_EXPLORE_CURRENT_STATE
  max_explore_current_state: 10
  # 앱 밖에서 연속으로 이만큼 step 을 보내면 BACK 으로 되돌린다. 임계 이하에서는 그냥 탐색을
  # 계속한다 — 일시적인 시스템 화면은 스스로 사라지는 쪽이 흔해서 첫 프레임에 BACK 을 치면
  # step 만 버린다. Env: MC_EXPLORATION_MAX_STEPS_OUTSIDE
  max_steps_outside: 3
  # 네비게이션 계획 하나가 쓸 수 있는 최대 step. 초과하면 계획을 버리고 재계획한다.
  # Env: MC_EXPLORATION_MAX_NAVIGATE_STEPS
  max_navigate_steps: 10
  # activity coverage 가 이만큼의 step 동안 늘지 않으면 앱 재시작을 **요청**한다
  # (정책은 결정만 내고 디바이스는 수집 루프가 몬다). Env: MC_EXPLORATION_MAX_ACTIVITY_STAGNATION
  max_activity_stagnation: 100
  # 미탐색 우선 분기를 건너뛰고 곧바로 무작위 action 을 낼 확률. 레퍼런스 기본값 0.0.
  # Env: MC_EXPLORATION_RANDOM_EXPLORE_PROB
  random_explore_prob: 0.0
  # same-function 그룹 가지치기 on/off. **LLM 이 탐색 결과를 되돌릴 수 없게 바꾸는 유일한
  # 스위치다** — 끄면 라벨은 계속 붙지만 후보는 하나도 줄지 않는다.
  # Env: MC_EXPLORATION_SKIP_SIMILAR_ELEMENTS
  skip_similar_elements: true
  # 화면의 **actionable element 수**가 이 값 미만이면 그룹핑을 적용하지 않는다.
  # 그룹 크기 하한이 아니라 **화면 크기 하한**이다 (레퍼런스 상수 이름이
  # MIN_SIZE_SAME_FUNCTION_ELEMENT_GROUP 이지만 실제로는 len(elements) 를 본다).
  # 자세한 내막은 src/monkey_collector/semantic.py 의 모듈 docstring.
  # Env: MC_EXPLORATION_MIN_ELEMENTS_FOR_GROUPING
  min_elements_for_grouping: 5

llm:
  # LLM 이 쓰이는 곳은 정확히 셋이다 (AGENTS §2(c)): semantic 라벨 생성, same-function
  # element 그룹핑, input_text 값 생성. **page 식별에는 절대 쓰지 않는다**, 그리고
  # "다음에 무엇을 누를지" 도 고르지 않는다.
  # OpenRouter Chat Completions 모델 id. Env: MC_LLM_MODEL
  model: qwen/qwen3.8-flash
  # 입력 텍스트 생성 모드. Options: api | random
  #   api    = OpenRouter LLM (OPENROUTER_API_KEY 필요)
  #   random = hardcoded fallback (API 비용 없음)
  # Env: MC_LLM_INPUT_MODE
  input_mode: api
  # semantic 라벨 + same-function 그룹핑을 LLM 에 물어볼지. false 이거나
  # OPENROUTER_API_KEY 가 없으면 라벨은 structure_str, 그룹은 빈 집합으로 열화한다
  # (가지치기만 사라지고 탐색은 그대로 계속된다). 활성 여부는 graph.json 의
  # semantic_labeling 에 기록된다. Env: MC_LLM_SEMANTIC_LABELING
  semantic_labeling: true

export:
  # Stage-1 export 좌표 프레임 [width, height]. 840x1876 = smart_resize_dims(2400, 1080).
  # 이 값은 EXP08 export contract 의 일부라 임의로 바꾸면 안 된다.
  # action 좌표도 이 프레임을 쓴다 — 840x1876, device 원본(1080x2400) 이 아니다.
  # Env: MC_EXPORT_TARGET_SIZE ("840x1876" 형식)
  target_size: [840, 1876]
  # OOD eval: train 에서 통째로 제외할 **앱**의 비율. Env: MC_EXPORT_OOD_APPS
  ood_apps: 0.3
  # ID eval: train 에 포함된(seen) 앱들의 triple 중 eval 로 떼어낼 비율.
  # ood_apps 와 완전히 독립적인 knob 이다. Env: MC_EXPORT_ID_RATIO
  id_ratio: 0.1
