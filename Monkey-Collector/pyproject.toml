[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monkey-collector"
version = "0.1.0"
description = "Android GUI data collector for world modeling"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7",
    "Pillow>=10.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pyvis>=0.3",
    "networkx>=3",
    "requests>=2.32",
    "gplaydl>=2.0",
    "androguard>=4.1.4",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["monkey_collector*"]

# The review UI is one HTML page plus its CSS/JS, loaded off disk by
# `review/server.py`. Without this they are missing from a built wheel and the
# server serves 404s for its own assets.
[tool.setuptools.package-data]
"monkey_collector.review" = ["static/*"]

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
monkey-collect = "monkey_collector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short", "-q"]
markers = [
    "integration: tests exercising multiple modules together",
    "slow: tests taking more than 1 second",
]
timeout = 10

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["monkey_collector"]

[tool.ruff.lint.per-file-ignores]
# structured_parser.py is VENDORED VERBATIM from
# .claude/references/parser/structured_xml_parser_v2_htmllike.py and is frozen
# on purpose: its transform must stay byte-for-byte identical to the code that
# produced the EXP08 corpus, or our XML stops matching the training
# distribution. Lint is off here so nobody "tidies" it. Do NOT run
# `ruff --fix` on this file.
"src/monkey_collector/xml/structured_parser.py" = ["ALL"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Same reason as the ruff per-file-ignore above: frozen vendored code. Its type
# errors are pre-existing in the reference file; they are recorded, not
# silenced by editing the source.
module = "monkey_collector.xml.structured_parser"
ignore_errors = true
