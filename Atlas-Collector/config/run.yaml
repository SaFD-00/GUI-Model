# Atlas-Collector — 수집 파라미터.
#
# Resolution order (later wins):
#   builtin defaults (src/atlas_collector/config.py) → config/run.yaml → AC_* env vars → CLI flags
#
# CLI flags take highest precedence. 이 파일이 없어도 builtin defaults 로 동작한다
# (`atlas-collect --help` 가 환경에 의존하지 않도록).
#
# builtin defaults 는 이 파일의 값과 **정확히 같아야** 한다 (config.py 의 _BUILTIN_DEFAULTS).

device:
  # 대상 디바이스 serial. null = `adb devices` 에서 자동 탐색.
  # 실측 타깃: Pixel 6 (oriole), serial 19101FDF6004EH, Android 16 / SDK 36.
  # Env: AC_DEVICE_SERIAL
  serial: null
  # 디바이스 논리 해상도 (`adb shell wm size`). export 좌표 변환의 소스 프레임이다.
  # Env: AC_DEVICE_WIDTH / AC_DEVICE_HEIGHT
  width: 1080
  height: 2400

collection:
  # 세션 종료 조건. Options: steps | time
  #   time:  max_duration 만큼의 벽시계 시간이 지나면 종료 (기본)
  #   steps: max_steps 만큼 action 을 수행하면 종료
  # Env: AC_COLLECTION_BUDGET_MODE
  budget_mode: time
  # 앱당 벽시계 예산 (budget_mode=time 일 때 종료 조건).
  # "2h" / "120m" / "7200s" / 숫자(초) 를 받는다. 파싱 실패나 0 이하는 에러다
  # (조용히 2h 로 폴백하면 오타난 설정이 성공한 것처럼 보인다).
  # 실측 참고: Pixel 6 에서 step 당 dump 2.33s + screencap 0.67s + action_delay 1.5s
  # 이므로 2h 는 앱당 대략 1,000~1,500 step 에 해당한다.
  # Env: AC_COLLECTION_MAX_DURATION
  max_duration: "2h"
  # 앱당 최대 step 수 (budget_mode=steps 일 때만 사용). Env: AC_COLLECTION_MAX_STEPS
  max_steps: 1500
  # explorer 난수 시드. Env: AC_COLLECTION_SEED
  seed: 42
  # action 실행 후 다음 관측까지의 기본 지연(ms). Env: AC_COLLECTION_ACTION_DELAY_MS
  action_delay_ms: 1500
  # --- host-pull 전용: 화면 안정화(stabilization) ---
  # device-push 설계와 달리 디바이스가 "화면이 바뀌었다" 는 신호를 보내주지 않으므로
  # 호스트가 스스로 판정해야 한다. **스크린샷 픽셀 비교**로 폴링하고, 화면이 멎은 뒤
  # `uiautomator dump` 를 딱 한 번 뜬다. Pixel 6 실측 근거 (6회 중앙값):
  #   uiautomator dump 2.341s / screencap -p 0.680s  -> 스크린샷 폴링이 3.44배 싸다.
  # 자세한 설계는 src/atlas_collector/stabilize.py 의 모듈 docstring 을 본다.
  #
  # 폴링 사이 추가 sleep(ms). 기본 0 — screencap 자체가 ~0.68s 라 프레임 간격은
  # 이미 충분히 벌어져 있고, sleep 을 더하면 지연만 늘어난다.
  # Env: AC_COLLECTION_STABILIZE_POLL_MS
  stabilize_poll_ms: 0
  # 안정화 최대 대기(초). 초과하면 마지막 프레임을 채택하고 settled=False 로 진행한다.
  # 영상·스피너·깜빡이는 커서처럼 **영원히 안 멎는 화면**이 실제로 있으므로 필수다.
  # Env: AC_COLLECTION_STABILIZE_MAX_WAIT_SEC
  stabilize_max_wait_sec: 8.0
  # 변경 픽셀 비율이 이 값 이하면 "멎었다" 로 본다. **0 이 아니다** — 실측상 실제
  # 화면 전환은 0.0000 까지 수렴하지만, 안 멎는 화면에 0 을 요구하면 매 step 마다
  # 대기 예산을 통째로 태운다(조용한 데다 가장 비싼 실패 모드).
  # Env: AC_COLLECTION_STABILIZE_PIXEL_THRESHOLD
  stabilize_pixel_threshold: 0.005
  # 픽셀 하나가 "바뀌었다" 고 볼 밝기 차(0-255). 리샘플링 흔들림·서브픽셀 AA 를 흡수한다.
  # Env: AC_COLLECTION_STABILIZE_LUMA_DELTA
  stabilize_luma_delta: 10
  # 비교용 썸네일 가로 폭(px). 100 이면 1080x2400 이 100x222 로 줄어 비교 22ms.
  # Env: AC_COLLECTION_STABILIZE_LOW_RES_WIDTH
  stabilize_low_res_width: 100

page_matching:
  # page 식별은 **LLM-Explorer 방법**이고 항상 LLM-free 다.
  # 픽셀은 page 식별에 쓰지 않는다 — 스크린샷 비교는 화면 **안정화** 전용이다
  # (collection.stabilize_* / src/atlas_collector/stabilize.py).
  #
  # 정체성은 activity 로 스코프된 두 해시다 (device_state.py 이식):
  #   state_str      = md5("{activity}{sorted(content-aware signature)}")
  #   structure_str  = md5("{activity}{sorted(content-free signature)}")
  # 병합은 state_str 일치 -> structure_str 일치 순으로 먼저 시도한다.
  #
  # merge_policy: 두 해시가 모두 빗나갔을 때의 처리.
  #   structure_only    레퍼런스의 **실제** 동작 그대로 (새 page 발급).
  #                     레퍼런스의 LLM 선택 분기는 dead code 라 실제로는 여기서 멈춘다.
  #   similar_elements  (기본) 같은 activity 안에서 content-free signature 대칭차가
  #                     max_diff_elements 이하인 가장 가까운 page 로 병합.
  #                     dead code 가 비워둔 자리를 LLM 없이 메운다.
  # Env: AC_PAGE_MATCHING_MERGE_POLICY
  merge_policy: similar_elements
  # 대칭차 예산. 레퍼런스의 MAX_NUM_DIFF_ELEMENTS_IN_SIMILAR_STATES = 2 를 그대로 쓴다.
  # Pixel 6 실측 여유: 같은 page 스크롤 = 2, 가장 가까운 **다른** 화면 = 18.
  # 넓히지 마라 — 과병합은 시도하지도 않은 action 을 explored 로 표시하고, 그 손상은
  # 수집된 데이터만 봐서는 복구도 발견도 안 된다. 의심스러우면 structure_only 로 좁혀라.
  # Env: AC_PAGE_MATCHING_MAX_DIFF_ELEMENTS
  max_diff_elements: 2
  # activity 가 다르면 병합하지 않는다 (레퍼런스의 filter_same_activity).
  # Env: AC_PAGE_MATCHING_SAME_ACTIVITY_ONLY
  same_activity_only: true

llm:
  # LLM 은 **입력 텍스트 생성 단 하나**에만 쓰인다. page 식별에는 절대 쓰지 않는다.
  # OpenRouter Chat Completions 모델 id. Env: AC_LLM_MODEL
  model: qwen/qwen3.8-flash
  # 입력 텍스트 생성 모드. Options: api | random
  #   api    = OpenRouter LLM (OPENROUTER_API_KEY 필요)
  #   random = hardcoded fallback (API 비용 없음)
  # Env: AC_LLM_INPUT_MODE
  input_mode: api

export:
  # Stage-1 export 좌표 프레임 [width, height]. 840x1876 = smart_resize_dims(2400, 1080).
  # 이 값은 EXP08 export contract 의 일부라 임의로 바꾸면 안 된다 (ARCHITECTURE.md 참조).
  # Env: AC_EXPORT_TARGET_SIZE ("840x1876" 형식)
  target_size: [840, 1876]
  # OOD eval: train 에서 통째로 제외할 **앱**의 비율. Env: AC_EXPORT_OOD_APPS
  ood_apps: 0.3
  # ID eval: train 에 포함된(seen) 앱들의 triple 중 eval 로 떼어낼 비율.
  # ood_apps 와 완전히 독립적인 knob 이다. Env: AC_EXPORT_ID_RATIO
  id_ratio: 0.1
