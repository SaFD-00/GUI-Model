# Atlas-Collector — 수집 파라미터.
#
# Resolution order (later wins):
#   builtin defaults (src/atlas_collector/config.py) → config/run.yaml → AC_* env vars → CLI flags
#
# CLI flags take highest precedence. 이 파일이 없어도 builtin defaults 로 동작한다
# (`atlas-collect --help` 가 환경에 의존하지 않도록).
#
# builtin defaults 는 이 파일의 값과 **정확히 같아야** 한다 (config.py 의 _BUILTIN_DEFAULTS).

device:
  # 대상 디바이스 serial. null = `adb devices` 에서 자동 탐색.
  # 실측 타깃: Pixel 6 (oriole), serial 19101FDF6004EH, Android 16 / SDK 36.
  # Env: AC_DEVICE_SERIAL
  serial: null
  # 디바이스 논리 해상도 (`adb shell wm size`). export 좌표 변환의 소스 프레임이다.
  # Env: AC_DEVICE_WIDTH / AC_DEVICE_HEIGHT
  width: 1080
  height: 2400

collection:
  # 세션 종료 조건. Options: steps | time
  #   time:  max_duration 만큼의 벽시계 시간이 지나면 종료 (기본)
  #   steps: max_steps 만큼 action 을 수행하면 종료
  # Env: AC_COLLECTION_BUDGET_MODE
  budget_mode: time
  # 앱당 벽시계 예산 (budget_mode=time 일 때 종료 조건).
  # "2h" / "120m" / "7200s" / 숫자(초) 를 받는다. 파싱 실패나 0 이하는 에러다
  # (조용히 2h 로 폴백하면 오타난 설정이 성공한 것처럼 보인다).
  # 실측 참고: Pixel 6 에서 step 당 dump 2.33s + screencap 0.67s + action_delay 1.5s
  # 이므로 2h 는 앱당 대략 1,000~1,500 step 에 해당한다.
  # Env: AC_COLLECTION_MAX_DURATION
  max_duration: "2h"
  # 앱당 최대 step 수 (budget_mode=steps 일 때만 사용). Env: AC_COLLECTION_MAX_STEPS
  max_steps: 1500
  # explorer 난수 시드. Env: AC_COLLECTION_SEED
  seed: 42
  # action 실행 후 다음 관측까지의 기본 지연(ms). Env: AC_COLLECTION_ACTION_DELAY_MS
  action_delay_ms: 1500
  # --- host-pull 전용: 화면 안정화(stabilization) ---
  # device-push 설계와 달리 디바이스가 "화면이 바뀌었다" 는 신호를 보내주지 않는다.
  # 호스트가 직접 `uiautomator dump` 를 반복해 연속 두 dump 가 같아질 때까지 폴링한다.
  # 폴링 간격(ms). Env: AC_COLLECTION_STABILIZE_POLL_MS
  stabilize_poll_ms: 300
  # 안정화 최대 대기(초). 초과하면 마지막 dump 를 그대로 채택하고 진행한다.
  # Env: AC_COLLECTION_STABILIZE_MAX_WAIT_SEC
  stabilize_max_wait_sec: 8.0

screen_matching:
  # page 식별은 항상 LLM-free 다 (BM25 + element diff + pixel gate, LLM-Explorer / Mobile3M 계열).
  # 같은 page 로 볼 최대 element-line 차이 수 (|A △ B| < element_diff_max).
  # Env: AC_SCREEN_MATCHING_ELEMENT_DIFF_MAX
  element_diff_max: 5
  # element_criterion=jaccard 로 쓸 때의 최소 Jaccard 유사도.
  # Env: AC_SCREEN_MATCHING_ELEMENT_JACCARD_MIN
  element_jaccard_min: 0.5
  # page 병합을 확정하는 pixel gate: 변경 픽셀 비율이 이 값보다 작아야 같은 page.
  # Env: AC_SCREEN_MATCHING_PAGE_PIXEL_DIFF_THRESHOLD
  page_pixel_diff_threshold: 0.3

llm:
  # LLM 은 **입력 텍스트 생성 단 하나**에만 쓰인다. page 식별에는 절대 쓰지 않는다.
  # OpenRouter Chat Completions 모델 id. Env: AC_LLM_MODEL
  model: qwen/qwen3.8-flash
  # 입력 텍스트 생성 모드. Options: api | random
  #   api    = OpenRouter LLM (OPENROUTER_API_KEY 필요)
  #   random = hardcoded fallback (API 비용 없음)
  # Env: AC_LLM_INPUT_MODE
  input_mode: api

export:
  # Stage-1 export 좌표 프레임 [width, height]. 840x1876 = smart_resize_dims(2400, 1080).
  # 이 값은 EXP08 export contract 의 일부라 임의로 바꾸면 안 된다 (ARCHITECTURE.md 참조).
  # Env: AC_EXPORT_TARGET_SIZE ("840x1876" 형식)
  target_size: [840, 1876]
  # OOD eval: train 에서 통째로 제외할 **앱**의 비율. Env: AC_EXPORT_OOD_APPS
  ood_apps: 0.3
  # ID eval: train 에 포함된(seen) 앱들의 triple 중 eval 로 떼어낼 비율.
  # ood_apps 와 완전히 독립적인 knob 이다. Env: AC_EXPORT_ID_RATIO
  id_ratio: 0.1
