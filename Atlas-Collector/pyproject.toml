[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-collector"
version = "0.1.0"
description = "Host-pull Android GUI data collector producing Stage-1 world-modeling triples"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "loguru>=0.7",
    "openai>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
atlas-collect = "atlas_collector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_collector"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short", "-q"]
markers = [
    "integration: tests exercising multiple modules together",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atlas_collector"]

[tool.ruff.lint.per-file-ignores]
# structured_parser.py is VENDORED VERBATIM from
# .claude/references/parser/structured_xml_parser_v2_htmllike.py and is frozen on
# purpose: its transform must stay byte-for-byte identical to the code that produced
# the EXP08 corpus, or our XML stops matching the training distribution. Lint is off
# here so nobody "tidies" it. Do NOT run `ruff --fix` on this file.
"src/atlas_collector/xml/structured_parser.py" = ["ALL"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Same reason as the ruff per-file-ignore above: frozen vendored code. Its 10 type
# errors are pre-existing in the reference file (see notes on `_get_area`); they are
# recorded, not silenced by editing the source.
module = "atlas_collector.xml.structured_parser"
ignore_errors = true
